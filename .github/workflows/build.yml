name: Build Arch Repo (latest-only stable)

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      # ---------------------------
      # Checkout
      # ---------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      # Cache pacman
      # ---------------------------
      - name: Cache pacman
        uses: actions/cache@v5
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ runner.os }}

      # ---------------------------
      # Install tools
      # ---------------------------
      - name: Install base tools
        run: |
          pacman -Sy --noconfirm base-devel git sudo pacman

      # ---------------------------
      # Setup builder user
      # ---------------------------
      - name: Setup builder
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      # ---------------------------
      # Build packages
      # ---------------------------
      - name: Build packages
        run: |
          set -euo pipefail

          mkdir -p repo/x86_64
          BUILT_PKGS=""

          build_pkg() {
            pkgdir="$1"
            [ -d "$pkgdir" ] || return

            echo "========================"
            echo "Building $pkgdir"
            echo "========================"

            pushd "$pkgdir" >/dev/null

            sudo -u builder makepkg -s --noconfirm --clean --skippgpcheck || {
              echo "FAILED: $pkgdir"
              exit 1
            }

            for pkgfile in *.pkg.tar.zst; do
              [ -f "$pkgfile" ] && mv "$pkgfile" ../../repo/x86_64/
            done

            popd >/dev/null

            BUILT_PKGS="$BUILT_PKGS $(basename "$pkgdir")"
          }

          for pkg in pkgs/*; do
            build_pkg "$pkg"
          done

          echo "$BUILT_PKGS" > built_pkgs.txt

          echo "Built packages:"
          cat built_pkgs.txt

      # ---------------------------
      # Checkout gh-pages
      # ---------------------------
      - name: Checkout gh-pages
        run: |
          git clone --branch gh-pages \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} pages

      # ---------------------------
      # Sync + prune + latest version only
      # ---------------------------
      - name: Sync repo (latest-only prune)
        run: |
          set -euo pipefail

          mkdir -p pages/x86_64

          # copy new packages
          shopt -s nullglob
          cp repo/x86_64/*.pkg.tar.zst pages/x86_64/ || true

          cd pages/x86_64

          echo "=== RAW PACKAGES ==="
          ls -1

          # ---------------------------
          # latest-version selection
          # ---------------------------
          declare -A latest_file
          declare -A latest_ver

          for file in *.pkg.tar.zst; do
            [ -e "$file" ] || continue

            # extract name/version safely
            base="${file%.pkg.tar.zst}"
            namever="${base%-*-*}"
            name="${namever%-*}"
            ver="${namever##*-}"

            if [[ -z "${latest_ver[$name]:-}" ]]; then
              latest_ver["$name"]="$ver"
              latest_file["$name"]="$file"
            else
              if vercmp "$ver" "${latest_ver[$name]}" > 0; then
                rm -f "${latest_file[$name]}"
                latest_ver["$name"]="$ver"
                latest_file["$name"]="$file"
              else
                rm -f "$file"
              fi
            fi
          done

          echo "=== CLEANED PACKAGES ==="
          ls -1

          # ---------------------------
          # remove orphan packages
          # ---------------------------
          for file in *.pkg.tar.zst; do
            pkgname=$(echo "$file" | sed -E 's/-[0-9].*//')

            if ! grep -qw "$pkgname" ../../built_pkgs.txt; then
              echo "Removing orphan: $file"
              rm -f "$file"
            fi
          done

          # ---------------------------
          # rebuild repo DB
          # ---------------------------
          rm -f *.db.tar.gz *.files.tar.gz || true
          repo-add myrepo.db.tar.gz *.pkg.tar.zst

      # ---------------------------
      # Push changes
      # ---------------------------
      - name: Push gh-pages
        run: |
          set -euo pipefail

          cd pages

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "update repo (latest-only)" || echo "no changes"
          git push