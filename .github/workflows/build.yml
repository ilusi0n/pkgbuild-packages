name: Build packages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      # 2. Cache pacman packages
      # ---------------------------
      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-cache

      # ---------------------------
      # Install dependencies
      # ---------------------------
      - name: Install build tools
        run: |
          pacman -Sy --noconfirm base-devel git sudo

      # ---------------------------
      # 3. Strict build environment
      # ---------------------------
      - name: Setup builder user
        run: |
          set -euo pipefail

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          chown -R builder:builder .

      # ---------------------------
      # 3. Validate PKGBUILDs early
      # ---------------------------
      - name: Validate PKGBUILDs
        run: |
          set -euo pipefail

          for d in pkgs/*; do
            echo "Checking $d"
            test -f "$d/PKGBUILD"
            sudo -u builder bash -c "cd $d && makepkg --printsrcinfo > /dev/null"
          done

      # ---------------------------
      # 10. Parallel build (xargs)
      # ---------------------------
      - name: Build packages (parallel)
        run: |
          set -euo pipefail

          mkdir -p repo/x86_64

          build_pkg() {
            pkgdir=$1
            echo "Building $pkgdir"

            cd "$pkgdir"

            sudo -u builder makepkg -s --noconfirm --clean --skippgpcheck

            pkgfile=$(ls *.pkg.tar.zst 2>/dev/null || true)

            if [ -z "$pkgfile" ]; then
              echo "ERROR: build failed in $pkgdir"
              exit 1
            fi

            mv "$pkgfile" ../../repo/x86_64/
          }

          export -f build_pkg

          find pkgs -mindepth 1 -maxdepth 1 -type d \
            | xargs -n 1 -P 4 bash -c 'build_pkg "$@"' _

      # ---------------------------
      # Checkout gh-pages
      # ---------------------------
      - name: Checkout gh-pages
        run: |
          git clone \
            --branch gh-pages \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} \
            pages

      # ---------------------------
      # 4. Clean repo rebuild (IMPORTANT)
      # ---------------------------
      - name: Rebuild repo database
        run: |
          set -euo pipefail

          mkdir -p pages/x86_64

          # copy packages
          cp repo/x86_64/*.pkg.tar.zst pages/x86_64/ 2>/dev/null || true

          cd pages/x86_64

          # clean old database
          rm -f *.db.tar.gz *.files.tar.gz || true

          # rebuild from scratch
          repo-add myrepo.db.tar.gz *.pkg.tar.zst

      # ---------------------------
      # Commit to gh-pages
      # ---------------------------
      - name: Push gh-pages
        run: |
          set -euo pipefail

          cd pages

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "update repo" || echo "no changes"

          git push