name: Build pkgbuild packages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      # ---------------------------
      # Checkout repo
      # ---------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------
      # Cache pacman
      # ---------------------------
      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-cache

      # ---------------------------
      # Install dependencies
      # ---------------------------
      - name: Install base tools
        run: |
          pacman -Sy --noconfirm base-devel git sudo

      # ---------------------------
      # Setup builder user
      # ---------------------------
      - name: Setup builder user
        run: |
          set -euo pipefail

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          chown -R builder:builder .

      # ---------------------------
      # Validate PKGBUILDs
      # ---------------------------
      - name: Validate PKGBUILDs
        run: |
          set -euo pipefail

          for pkg in pkgs/*; do
            echo "Checking $pkg"

            if [ ! -f "$pkg/PKGBUILD" ]; then
              echo "ERROR: Missing PKGBUILD in $pkg"
              exit 1
            fi

            sudo -u builder bash -c "cd $pkg && makepkg --printsrcinfo > /dev/null"
          done

      # ---------------------------
      # Build packages (SAFE SEQUENTIAL)
      # ---------------------------
      - name: Build packages
        run: |
          set -euo pipefail

          mkdir -p repo/x86_64

          build_pkg() {
            pkgdir="$1"

            echo "========================"
            echo "Building $pkgdir"
            echo "========================"

            cd "$pkgdir"

            # skip PGP checks (fix for r8168 issue)
            sudo -u builder makepkg -s --noconfirm --clean --skippgpcheck

            pkgfile=$(ls *.pkg.tar.zst 2>/dev/null || true)

            if [ -z "$pkgfile" ]; then
              echo "ERROR: No package produced in $pkgdir"
              exit 1
            fi

            mv "$pkgfile" ../../repo/x86_64/
          }

          for pkg in pkgs/*; do
            if [ -d "$pkg" ]; then
              build_pkg "$pkg"
            else
              echo "Skipping invalid path: $pkg"
            fi
          done

      # ---------------------------
      # Checkout gh-pages
      # ---------------------------
      - name: Checkout gh-pages
        run: |
          git clone \
            --branch gh-pages \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} \
            pages

      # ---------------------------
      # Build repo database cleanly
      # ---------------------------
      - name: Build repo database
        run: |
          set -euo pipefail

          mkdir -p pages/x86_64

          echo "Copying packages..."
          find repo/x86_64 -name "*.pkg.tar.zst" -exec cp {} pages/x86_64/ \;

          cd pages/x86_64

          echo "Repo contents:"
          ls -lah

          # remove old database files
          rm -f *.db.tar.gz *.files.tar.gz || true

          # rebuild repo database
          repo-add myrepo.db.tar.gz *.pkg.tar.zst

      # ---------------------------
      # Push to gh-pages
      # ---------------------------
      - name: Push gh-pages
        run: |
          set -euo pipefail

          cd pages

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "update repo" || echo "no changes"

          git push