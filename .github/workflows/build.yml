name: Build pkgbuild packages

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      # ---------------------------
      # Checkout
      # ---------------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ---------------------------
      # Cache pacman packages
      # ---------------------------
      - name: Cache pacman
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-cache

      # ---------------------------
      # Install dependencies
      # ---------------------------
      - name: Install base tools
        run: |
          pacman -Sy --noconfirm base-devel git sudo

      # ---------------------------
      # Setup builder user
      # ---------------------------
      - name: Setup builder
        run: |
          set -euo pipefail

          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          chown -R builder:builder .

      # ---------------------------
      # Validate PKGBUILDs early
      # ---------------------------
      - name: Validate PKGBUILDs
        run: |
          set -euo pipefail

          for pkg in pkgs/*; do
            echo "Checking $pkg"

            test -f "$pkg/PKGBUILD"

            sudo -u builder bash -c "cd $pkg && makepkg --printsrcinfo > /dev/null"
          done

      # ---------------------------
      # Build packages (SEQUENTIAL - SAFE)
      # ---------------------------
      - name: Build packages
        run: |
          set -euo pipefail

          mkdir -p repo/x86_64

          build_pkg() {
            pkgdir="$1"

            echo "========================"
            echo "Building $pkgdir"
            echo "========================"

            cd "$pkgdir"

            # IMPORTANT: skip PGP issues (your current setup)
            sudo -u builder makepkg -s --noconfirm --clean --skippgpcheck

            pkgfile=$(ls *.pkg.tar.zst 2>/dev/null || true)

            if [ -z "$pkgfile" ]; then
              echo "ERROR: No package produced in $pkgdir"
              exit 1
            fi

            mv "$pkgfile" ../../repo/x86_64/
          }

          for pkg in pkgs/*; do
            build_pkg "$pkg"
          done

      # ---------------------------
      # Checkout gh-pages
      # ---------------------------
      - name: Checkout gh-pages
        run: |
          git clone \
            --branch gh-pages \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} \
            pages

      # ---------------------------
      # Rebuild repo database (clean)
      # ---------------------------
      - name: Build repo database
        run: |
          set -euo pipefail

          mkdir -p pages/x86_64

          # copy packages safely
          find repo/x86_64 -name "*.pkg.tar.zst" -exec cp {} pages/x86_64/ \;

          cd pages/x86_64

          echo "Repo contents:"
          ls -lah

          # remove old DB files
          rm -f *.db.tar.gz *.files.tar.gz || true

          # rebuild database
          repo-add myrepo.db.tar.gz *.pkg.tar.zst

      # ---------------------------
      # Commit and push
      # ---------------------------
      - name: Push gh-pages
        run: |
          set -euo pipefail

          cd pages

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "update repo" || echo "no changes"

          git push