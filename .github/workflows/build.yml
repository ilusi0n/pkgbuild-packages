name: Build pkgbuild packages
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      # ---------------------------
      # Checkout repository
      # ---------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------
      # Install base tools
      # ---------------------------
      - name: Install base-devel and git
        run: |
          pacman -Sy --noconfirm base-devel git sudo

      # ---------------------------
      # Setup builder user
      # ---------------------------
      - name: Setup builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      # ---------------------------
      # Show PKGBUILDs for debug
      # ---------------------------
      - name: List PKGBUILDs
        run: ls -R pkgs

      # ---------------------------
      # Build packages
      # ---------------------------
      - name: Build packages sequentially
        run: |
          set -euo pipefail
          mkdir -p repo/x86_64

          build_pkg() {
            pkgdir="$1"

            if [ ! -d "$pkgdir" ]; then
              echo "Skipping invalid path: $pkgdir"
              return
            fi

            echo "========================"
            echo "Building $pkgdir"
            echo "========================"

            pushd "$pkgdir" >/dev/null

            # Build package, skip PGP check
            sudo -u builder makepkg -s --noconfirm --clean --skippgpcheck || {
              echo "FAILED BUILD: $pkgdir"
              exit 1
            }

            # Move all produced package files
            for pkgfile in *.pkg.tar.zst; do
              if [ -f "$pkgfile" ]; then
                echo "Moving $pkgfile"
                mv "$pkgfile" ../../repo/x86_64/
              fi
            done

            popd >/dev/null
          }

          # Build each package
          for pkg in pkgs/*; do
            build_pkg "$pkg"
          done

          echo "=== FINAL REPO CONTENT ==="
          ls -lah repo/x86_64

      # ---------------------------
      # Checkout gh-pages branch
      # ---------------------------
      - name: Checkout gh-pages
        run: |
          git clone \
            --branch gh-pages \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} \
            pages

      # ---------------------------
      # Copy packages and rebuild repo DB
      # ---------------------------
      - name: Update repo database
        run: |
          set -euo pipefail
          mkdir -p pages/x86_64

          echo "Copying packages..."
          find repo/x86_64 -name "*.pkg.tar.zst" -exec cp {} pages/x86_64/ \;

          cd pages/x86_64

          # remove old DB files
          rm -f *.db.tar.gz *.files.tar.gz || true

          echo "Creating repo database..."
          repo-add myrepo.db.tar.gz *.pkg.tar.zst

      # ---------------------------
      # Push updated repo
      # ---------------------------
      - name: Push gh-pages
        run: |
          set -euo pipefail
          cd pages
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "update repo" || echo "no changes"
          git push