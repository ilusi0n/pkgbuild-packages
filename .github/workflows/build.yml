name: Build Arch Repo

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm base-devel git

      - name: Prepare builder user
        run: |
          useradd -m builder
          chown -R builder:builder .

      - name: Build packages
        run: |
          set -e

          mkdir -p repo/x86_64

          su builder -c '
            for pkgdir in pkgs/*; do
              echo "=== Building $pkgdir ==="
              cd "$pkgdir"

              # Build package
              makepkg -s --noconfirm --clean

              # Move result to repo folder
              mv *.pkg.tar.zst ../../repo/x86_64/ || true

              cd - >/dev/null
            done
          '

      - name: Checkout gh-pages branch
        run: |
          git clone \
            --branch gh-pages \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} \
            pages

      - name: Update repo database
        run: |
          set -e

          mkdir -p pages/x86_64

          # Copy packages
          cp repo/x86_64/*.pkg.tar.zst pages/x86_64/ 2>/dev/null || true

          cd pages/x86_64

          # Remove old repo db (important to avoid stale data)
          rm -f myrepo.db.tar.gz myrepo.files.tar.gz || true

          # Create new repo database
          repo-add myrepo.db.tar.gz *.pkg.tar.zst || true

      - name: Commit and push changes
        run: |
          cd pages

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "update repo" || echo "No changes to commit"

          git push