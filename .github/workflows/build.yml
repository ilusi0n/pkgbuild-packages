name: Build Arch Repo

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm base-devel git sudo

      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Debug (IMPORTANT)
        run: |
          echo "Repo structure:"
          ls -R

      - name: Build packages
        run: |
          set -e

          mkdir -p repo/x86_64

          for pkgdir in pkgs/*; do
            echo "========================"
            echo "Building $pkgdir"
            echo "========================"

            cd "$pkgdir"

            # Ensure PKGBUILD exists
            if [ ! -f PKGBUILD ]; then
              echo "ERROR: No PKGBUILD in $pkgdir"
              exit 1
            fi

            # Build package as non-root user
            sudo -u builder makepkg -s --noconfirm --clean --skippgpcheck

            # Find produced package
            pkgfile=$(ls *.pkg.tar.zst 2>/dev/null || true)

            if [ -z "$pkgfile" ]; then
              echo "ERROR: No package produced in $pkgdir"
              exit 1
            fi

            echo "Built package: $pkgfile"

            mv "$pkgfile" ../../repo/x86_64/

            cd - >/dev/null
          done

      - name: Checkout gh-pages
        run: |
          git clone \
            --branch gh-pages \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} \
            pages

      - name: Update repo database
        run: |
          set -e

          mkdir -p pages/x86_64

          cp repo/x86_64/*.pkg.tar.zst pages/x86_64/ 2>/dev/null || true

          cd pages/x86_64

          # Clean old db files
          rm -f myrepo.db.tar.gz myrepo.files.tar.gz || true

          # Create repo database
          repo-add myrepo.db.tar.gz *.pkg.tar.zst

      - name: Commit and push gh-pages
        run: |
          cd pages

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "update repo" || echo "No changes"

          git push